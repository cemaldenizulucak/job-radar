<!DOCTYPE html>
<html lang="tr">
  <head>
    <title>İş İlanları</title>
  </head>
  <body>
    <div class="list-items-wrapper">
      <div data-test="list-items" class="list-items">
        <div
          data-test="ad-card"
          time="1 gün"
          workModelText="Hibrit"
          workTypeText="Tam zamanlı"
          positionName="Java Yazilim Uzmani"
          cityName="Istanbul(Avr.)"
          class="job-list-card-item"
        >
          <div>
            <a
              href="/is-ilani/ornek-teknoloji-frontend-developer-4291111111"
              target="_blank"
              data-test="ad-card-item"
              class="k-ad-card radius"
            >
              <div data-test="ad-card-top" class="card-top">
                <div data-test="company-logo">
                  <img
                    data-test="company-image"
                    alt="Ornek Teknoloji"
                    class="default-img"
                    src="https://www.kariyer.net/logo.png"
                  />
                </div>
                <div data-test="title-wrapper" class="title-wrapper">
                  <div class="title-left">
                    <span data-test="ad-card-title" class="k-ad-card-title multiline"
                      >Frontend Developer</span
                    >
                  </div>
                  <div data-test="subtitle-section" class="subtitle">
                    <span data-test="subtitle">Ornek Teknoloji</span>
                  </div>
                  <div data-test="job-detail" class="job-detail">
                    <span data-test="location" class="location">Istanbul</span>
                    <span data-test="work-model" class="work-model">Hibrit</span>
                  </div>
                </div>
              </div>
              <div class="card-footer-wrapper">
                <div data-test="mapped-badges">
                  <span data-test="text">Tam zamanlı</span>
                </div>
                <div data-test="ad-date">
                  <span data-test="ad-date-item-date-other">1 gün</span>
                </div>
              </div>
            </a>
          </div>
        </div>
        <div
          data-test="ad-card"
          time="2 gün"
          workModelText="Uzaktan"
          class="job-list-card-item"
        >
          <div>
            <a
              href="https://www.kariyer.net/is-ilani/pixel-works-react-developer-4292222222?utm_source=list"
              target="_blank"
              data-test="ad-card-item"
              class="k-ad-card radius"
            >
              <div data-test="title-wrapper">
                <span data-test="ad-card-title">React Developer</span>
                <span data-test="subtitle">Pixel Works</span>
                <span data-test="location">Ankara</span>
                <span data-test="work-model">Uzaktan</span>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
